name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Tests must never need real API keys.
      NETSENTRY_LLM_PROVIDER: mock
    steps:
      # Actions are pinned to commit SHAs (tags can move); the comment records the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Install Python 3.11 and locked dependencies
        run: |
          uv python install 3.11
          uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
